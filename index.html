<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf8f3">
  <meta name="description" content="Play Nim, try different positions, and explore the strategy with NMHS.">
  <title>Nim Lab — NMHS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="graph.css">
  <script src="engine.js" defer></script>
  <script src="graph.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="#top" aria-label="Nim Lab home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>NIM<span class="brand-dot">.</span>LAB</span><span class="brand-by">BY NMHS</span></a>
      <span class="header-note"><span class="live-dot"></span> PLAY · THINK · DISCOVER</span>
    </header>
    <main id="top" class="main-content">
      <div class="page-heading"><div><p class="eyebrow"><span class="live-dot"></span> NMHS GAME LAB</p><h1>Make your move<span>.</span></h1></div><p>Two games. One clever idea.</p></div>
      <nav class="game-tabs" aria-label="Choose a game">
        <button type="button" class="game-tab active" data-game="round1" aria-pressed="true"><span>01</span> One pile</button>
        <button type="button" class="game-tab" data-game="round3" aria-pressed="false"><span>03</span> Two piles</button>
      </nav>
      <div class="game-layout">
        <section class="game-card" aria-labelledby="game-title">
          <div class="game-card-header"><div><p class="card-kicker">THE CHALLENGE</p><h2 id="game-title">One pile</h2><p id="game-description"></p></div><span class="card-spark" aria-hidden="true">✳</span></div>
          <div class="board-header"><span id="turn-label">YOUR TURN</span><span class="board-indicator" aria-hidden="true"><i></i><i></i><i></i></span></div>
          <div id="board" class="board" aria-label="Game board"></div>
          <p id="status" class="game-status" role="status" aria-live="polite">Loading…</p>
          <div id="move-controls" class="move-controls"></div>
          <div class="game-footer"><span>FIND THE PATTERN <span aria-hidden="true">✳</span></span><button type="button" id="reset-btn" class="reset-button"><span aria-hidden="true">↺</span> Restart</button></div>
        </section>
        <aside class="sidebar" aria-label="Game settings and help">
          <section class="settings-card"><div class="side-heading"><div><p class="card-kicker">MAKE IT YOURS</p><h2>Game setup</h2></div><span aria-hidden="true">↗</span></div><div id="setup-controls" class="setup-controls"></div><div id="opponent-controls" class="opponent-controls"></div></section>
          <section class="help-card"><div class="side-heading"><div><p class="card-kicker">A LITTLE HELP</p><h2>Find the pattern</h2></div><span aria-hidden="true">✳</span></div>
            <div class="help-actions"><button type="button" id="hint-btn" class="help-button" aria-controls="hint-text" aria-expanded="false"><span>Hint</span><span aria-hidden="true">↗</span></button><button type="button" id="answer-btn" class="help-button" aria-controls="answer-text" aria-expanded="false"><span>Strategy graph</span><span aria-hidden="true">↗</span></button></div>
            <div id="hint-text" class="reveal-text" hidden></div>
          </section>
          <details class="history-card"><summary>Move history <span aria-hidden="true">＋</span></summary><div id="move-history" class="move-history"></div></details>
        </aside>
      </div>
      <section id="answer-text" class="graph-panel" aria-label="Strategy graph" hidden><div id="graph"></div></section>
    </main>
    <footer class="site-footer"><span>NIM<span class="brand-dot">.</span>LAB <span class="footer-by">/ NMHS</span></span><span>PLAY · NOTICE · DISCOVER</span></footer>
  </div>
</body>
</html>
